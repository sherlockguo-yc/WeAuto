name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 服务化之后有了运行时依赖（better-sqlite3 / bcryptjs / jsonwebtoken）。
      # node-version 必须与 N150 的 node 大版本一致：better-sqlite3 是原生模块，
      # 在 CI 里编译出来的二进制只认同一个 Node ABI。
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # 放在打包之前：测试不过就不发布 Release，避免坏版本流到 N150。
      - name: Test
        run: npm test

      - name: Get version
        id: ver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # WeAuto 是常驻服务，只打包源码；运行时依赖由 N150 的 restart.sh 现场安装。
      #
      # 依赖为什么不再进包（2026-10-14 实测）：
      #   · 带 node_modules 的包有 7.1MB，而 N150 在大陆出境到 GitHub 只剩约
      #     3.5KB/s（ghproxy 镜像已废、直连不通），7MB 要 30 分钟以上；
      #     deploy-agent 每轮只有 90s×4 次的预算，永远下不完 → 部署无限重试。
      #   · 改由 N150 从 npmmirror 安装（实测 3.5MB/s）：首次约 2 分钟，之后
      #     package-lock.json 未变则 0.3 秒跳过。包瘦到约 106KB，跨境不再是瓶颈。
      #   · 依赖装在 ~/weauto-deps（部署目录之外），绕开 rsync --delete；
      #     restart.sh 再用软链接把 node_modules 接回部署目录。
      #
      # secrets.age 必须打进包：deploy-agent 用
      #   rsync -a --delete --exclude 'data' --exclude '.env'
      # 同步部署目录，凡不在包内的文件都会被 --delete 清掉（首次部署就踩过这个坑）。
      # 密文本身是安全的，且 Git 是它的唯一权威来源，随包分发才自洽。
      - name: Package
        run: |
          mkdir -p pkg
          # public/ 必须打进包：页面依赖它（样式 + 前端脚本）。漏掉的表现是页面能打开但
          # 完全没有样式、按钮也不工作 —— 2026-10-14 首次部署就漏过一次。
          cp -r bin src tasks scripts public pkg/
          # package.json + package-lock.json 也要带上：restart.sh 靠它们装依赖
          cp restart.sh package.json package-lock.json secrets.age pkg/

          echo "${{ steps.ver.outputs.sha }}" > pkg/.version
          tar -czf weauto.tar.gz -C pkg .
          ls -lh weauto.tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.sha }}
          name: ${{ steps.ver.outputs.sha }}
          body: "Auto build ${{ steps.ver.outputs.sha }}"
          files: weauto.tar.gz
          prerelease: true

      # 同步上传到 Cloudflare R2（2026-10-15）：N150 在大陆，出境到 GitHub 只剩约
      # 3.5KB/s（ghproxy 镜像已废、直连不通），产物稍大就永远下不完，部署陷入
      # 无限重试。R2 走 Cloudflare 通道实测约 698KB/s，deploy-agent 会优先从这拉。
      # continue-on-error：R2 没配凭据时只是跳过上传，发布与部署照旧（自动回退）。
      - name: Upload to R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 未配置（缺 R2_BUCKET / R2_ACCOUNT_ID），跳过上传"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          aws s3 cp weauto.tar.gz \
            "s3://${R2_BUCKET}/weauto/${{ steps.ver.outputs.sha }}/weauto.tar.gz" \
            --endpoint-url "$ENDPOINT"
          echo "✓ 已上传到 R2"

      - name: Notify N150
        continue-on-error: true
        run: |
          curl -sS -X POST https://wemusic.sherlockguo.com/deploy \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"weauto\",\"version\":\"${{ steps.ver.outputs.sha }}\"}" \
            --max-time 10 --connect-timeout 5 || true
